<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>FridgeSense</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="header">
            <header id="description">
                <h1>FridgeSense</h1>
                <p>Search for recipes from ingredients in your Fridge!</p>
            </header>
            <div id="inputBar">
                <form id="inputForm">
                    <input type="text" id="input" placeholder="INPUT AN INGREDIENT" autocomplete="off">
                    <button id="submit" type="submit">SUBMIT</button>
                </form>
                <div id="recipeGenerationButtons">
                    <button id="clearAll" type="click">CLEAR</button>
                    <button id="generate" type="click">GENERATE</button>
                </div>
            </div>
            <div id="content"></div>
            <div id="recipes"></div>
            <button id="shoppingListButton">SHOPPING LIST</button>
            <div id="shoppingListOverall" class="modal-overlay">
                <div class="shoppingListContent">
                    <button id="closeShoppingListButton">&times;</button>
                    <ul id="shoppingListItems"></ul>
                </div>
            </div>
        </div>
        <script src="config.js"></script>
        <script type="module" src="ingredient.js"></script>
        <script type="module" src="recipe.js"></script>
        <script type="module" src="shopping.js"></script>
    </body>
</html>
